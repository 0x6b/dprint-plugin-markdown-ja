[workspace]
members = ["formatter/android", "formatter/cli", "formatter/core"]
default-members = ["."]
resolver = "2"

[package]
name = "dprint-plugin-markdown-ja"
version = "0.6.1"
authors = ["David Sherret <dsherret@gmail.com>", "kaoru <k@warpnine.io>"]
edition = "2021"
homepage = "https://github.com/0x6b/dprint-plugin-markdown-ja"
license = "MIT"
repository = "https://github.com/0x6b/dprint-plugin-markdown-ja"
description = "Opinionated and hacky Markdown formatter for dprint that follows Japanese-specific rules."

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[profile.formatter-release]
inherits = "release"
opt-level = "s"
codegen-units = 1
strip = "debuginfo"
# JNI catches panics; preserve the plugin's separate aborting Wasm profile.
panic = "unwind"

[features]
wasm = ["serde_json", "dprint-core/wasm"]
tracing = ["dprint-core/tracing"]

[[test]]
name = "specs"
path = "tests/spec_test.rs"
harness = false

[dependencies]
anyhow = "1.0.64"
dprint-core = { version = "0.67.4", features = ["formatting"] }
dprint-core-macros = "0.1.0"
pulldown-cmark = { version = "0.11.2", default-features = false }
regex = "1"
serde = { version = "1.0.144", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
unicode-width = "0.1.10"

[dev-dependencies]
dprint-development = "0.10.2"
serde_json = { version = "1.0" }
