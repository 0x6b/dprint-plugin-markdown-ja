name: Publish GitHub release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v6
      - uses: dsherret/rust-toolchain-file@v1
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "$version"
      - name: Test
        run: cargo test --locked
      - name: Build WASM plugin
        run: cargo build --locked --release --target wasm32-unknown-unknown --features wasm
      - name: Prepare release assets
        run: |
          version=$GITHUB_REF_NAME
          mkdir dist
          cp target/wasm32-unknown-unknown/release/dprint_plugin_markdown_ja.wasm dist/plugin.wasm
          sed "s|markdown-ja/0.0.0/schema.json|markdown-ja/$version/schema.json|" deployment/schema.json > dist/schema.json
          (cd dist && sha256sum plugin.wasm schema.json > SHA256SUMS)
      - name: Create GitHub release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          files: |
            dist/plugin.wasm
            dist/schema.json
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
