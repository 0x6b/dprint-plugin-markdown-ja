name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Formatter lint
        run: cargo clippy --locked -p dprint-markdown-ja-formatter-core -p dprint-markdown-ja-formatter-cli -p dprint-markdown-ja-formatter-android --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --locked --workspace
      - name: Host JNI integration
        run: bash formatter/scripts/test-jvm.sh

  aar:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install Android NDK
        run: |
          sdkmanager 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build AAR
        run: bash formatter/scripts/build-aar.sh
      - name: Check packaged AAR
        run: python3 formatter/scripts/check-aar.py "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dprint-markdown-ja-formatter-${{ github.sha }}
          path: target/dprint-markdown-ja-formatter.aar
          if-no-files-found: error
          retention-days: 14
