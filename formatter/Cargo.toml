[package]
name = "dprint-markdown-ja-formatter"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Native CLI and JNI adapters for Japanese-aware Markdown formatting"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0"
dprint-plugin-markdown-ja = { path = "..", version = "=0.6.1" }
ignore = "0.4"
jni = "0.21.1"
tempfile = "3.23"
