[package]
name = "dprint-markdown-ja-formatter-mcp"
version = "0.6.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Streamable HTTP MCP server for Japanese-aware Markdown formatting"
publish = false

[[bin]]
name = "dprint-markdown-ja-formatter-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
dprint-markdown-ja-formatter-core = { path = "../core", version = "=0.6.1" }
rmcp = { version = "3.4.0", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1.0"
