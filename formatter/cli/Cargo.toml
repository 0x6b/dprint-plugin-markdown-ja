[package]
name = "dprint-markdown-ja-formatter-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Native CLI for Japanese-aware Markdown and JSON formatting"
publish = false

[[bin]]
name = "dprint-markdown-ja-formatter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dprint-markdown-ja-formatter-core = { path = "../core", version = "=0.1.0" }
dprint-plugin-json = "=0.23.0"
ignore = "0.4"
tempfile = "3.23"
